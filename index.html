<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VECTOR CRM</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="sidebar">
    <h2>VECTOR CRM</h2>

    <nav>
        <div class="active">🚗 Автомобили</div>
        <div>👥 Клиенты</div>
        <div>🤝 Сделки</div>
        <div>💳 Платежи</div>
        <div>📄 Документы</div>
        <div>📊 Аналитика</div>
        <div>⚙ Настройки</div>
    </nav>
</div>


<div class="main">

<header>
    <input 
    id="search"
    placeholder="Поиск по VIN, автомобилю, клиенту..."
    >

    <div class="user">
        Павел
    </div>
</header>


<section class="car-header">

<div>
<h1 id="carTitle">
Загрузка...
</h1>

<p id="carMeta">
</p>
</div>


<div class="buttons">

<button id="saveBtn">
Сохранить
</button>

<button id="expenseBtn">
+ Расход
</button>

</div>


</section>



<section class="cards">


<div class="card money">
<label>Покупка</label>
<h2 id="purchasePrice">
0 ₽
</h2>
</div>


<div class="card money">
<label>Расходы</label>
<h2 id="expenseTotal">
0 ₽
</h2>
</div>


<div class="card money">
<label>Продажа</label>
<h2 id="salePrice">
0 ₽
</h2>
</div>


<div class="card money profit">
<label>Маржа</label>
<h2 id="margin">
0 ₽
</h2>
</div>


</section>



<div class="grid">


<div class="panel">

<h3>
Фотографии автомобиля
</h3>

<div id="photos" class="photos">
</div>


<input 
type="file"
id="fileInput"
multiple
>

</div>



<div class="panel">

<h3>
Данные автомобиля
</h3>


<label>Марка</label>
<input id="brand">


<label>Модель</label>
<input id="model">


<label>Год</label>
<input id="year">


<label>VIN</label>
<input id="vin">


<label>Пробег</label>
<input id="mileage">


<label>Статус</label>

<select id="status">

<option>
На складе
</option>

<option>
В пути
</option>

<option>
Продан
</option>

</select>


<label>Цена покупки</label>
<input id="purchase">


<label>Цена продажи</label>
<input id="sale">


</div>



<div class="panel">

<h3>
Расходы
</h3>

<div id="expenses">
</div>

</div>




<div class="panel">

<h3>
Документы
</h3>


<div id="documents">
</div>


</div>




<div class="panel">

<h3>
История изменений
</h3>


<div id="history">
</div>


</div>


</div>


</div>


<script src="app.js"></script>

</body>
</html>
