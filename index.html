<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR CRM - Автомобили</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="sidebar">
<h2>VECTOR CRM</h2>
<div class="active">🚗 Автомобили</div>
<div>👥 Клиенты</div>
<div>🤝 Сделки</div>
<div>💳 Платежи</div>
<div>📄 Документы</div>
<div>📊 Аналитика</div>
</div>

<main>
<header>
<input placeholder="Поиск VIN, автомобиль, клиент...">
<button onclick="openModal()">+ Добавить автомобиль</button>
</header>

<h1>Автомобили</h1>
<div id="cars" class="grid"></div>
</main>

<div id="modal" class="modal">
<div class="window">
<h2>Новый автомобиль</h2>
<input id="brand" placeholder="Марка">
<input id="model" placeholder="Модель">
<input id="year" placeholder="Год">
<input id="vin" placeholder="VIN">
<input id="mileage" placeholder="Пробег">
<input id="purchase_price" placeholder="Цена покупки">
<button onclick="saveCar()">Сохранить</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
