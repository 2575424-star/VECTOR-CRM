<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VECTOR CRM</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="sidebar">

<div class="logo">
VECTOR CRM
</div>

<div class="menu active">
🚗 Автомобили
</div>

<div class="menu">
👥 Клиенты
</div>

<div class="menu">
🤝 Сделки
</div>

<div class="menu">
💳 Платежи
</div>

<div class="menu">
📄 Документы
</div>

<div class="menu">
📊 Аналитика
</div>

</div>


<main>


<div class="topbar">

<div>
<h1>Автомобили</h1>
<p>Управление автопарком</p>
</div>


<button class="add-btn" onclick="openModal()">
＋ Добавить автомобиль
</button>


</div>



<div class="filters">

<input placeholder="🔍 Поиск VIN, марки, модели">

<button>
Все
</button>

<button>
На складе
</button>

<button>
В пути
</button>

<button>
Проданы
</button>

</div>



<div id="cars" class="cars-grid">

</div>


</main>




<div id="modal" class="modal">


<div class="window">


<h2>
Новый автомобиль
</h2>


<input id="brand" placeholder="Марка">

<input id="model" placeholder="Модель">

<input id="year" placeholder="Год">

<input id="vin" placeholder="VIN">

<input id="mileage" placeholder="Пробег">

<input id="purchase_price" placeholder="Цена покупки">


<button class="save-btn" onclick="saveCar()">
Сохранить
</button>


</div>


</div>



<script src="app.js"></script>


</body>
</html>
