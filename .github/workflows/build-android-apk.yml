name: Build VECTOR CRM Android APK

on:
  push:
    paths:
      - 'android-app/**'
      - 'mobile-access.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk VECTOR-CRM-v1.1.0-unsigned.apk

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VECTOR-CRM-v1.1.0-unsigned
          path: VECTOR-CRM-v1.1.0-unsigned.apk
          if-no-files-found: error
          retention-days: 30
